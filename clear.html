<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learnova — Refreshing...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060D1A;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .orb {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, #6366F1 0%, #7C3AED 50%, transparent 100%);
      box-shadow: 0 0 40px rgba(99,102,241,0.6);
      animation: pulse 1.4s ease-in-out infinite alternate;
      margin-bottom: 32px;
    }
    @keyframes pulse {
      from { transform: scale(0.92); box-shadow: 0 0 30px rgba(99,102,241,0.4); }
      to   { transform: scale(1.05); box-shadow: 0 0 60px rgba(99,102,241,0.8); }
    }
    h2 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    p  { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 8px; }
    .step { font-size: 13px; color: #6366F1; margin-top: 6px; min-height: 20px; }
    .done { color: #10B981; font-size: 15px; font-weight: 600; margin-top: 24px; display: none; }
  </style>
</head>
<body>
  <div class="orb"></div>
  <h2>Updating Learnova...</h2>
  <p>Clearing old cached files from your browser.</p>
  <p>This takes just a moment.</p>
  <div class="step" id="step">Starting...</div>
  <div class="done" id="done">All clear! Taking you to the app...</div>

  <script>
    const step = document.getElementById('step');
    const done = document.getElementById('done');

    async function clearEverything() {
      // 1. Unregister all service workers
      step.textContent = 'Removing service workers...';
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const reg of regs) await reg.unregister();
      }

      // 2. Clear all Cache API caches (Flutter stores files here)
      step.textContent = 'Clearing app cache...';
      if ('caches' in window) {
        const keys = await caches.keys();
        for (const key of keys) await caches.delete(key);
      }

      // 3. Clear localStorage (keeps user logged in — only clears app cache keys)
      step.textContent = 'Clearing local data...';
      const keep = ['token','role','userId','student_id','student_name','name'];
      const toRemove = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!keep.includes(k)) toRemove.push(k);
      }
      // Only remove flutter/cache keys, keep auth
      toRemove
        .filter(k => k.startsWith('flutter') || k.startsWith('cache') || k.startsWith('dart'))
        .forEach(k => localStorage.removeItem(k));

      // 4. Done — redirect
      step.textContent = '';
      done.style.display = 'block';

      // Redirect with no-cache headers to force fresh load
      setTimeout(() => {
        window.location.replace('/?v=' + Date.now());
      }, 1500);
    }

    clearEverything().catch(() => {
      // Even if something fails, still redirect
      step.textContent = 'Done!';
      setTimeout(() => window.location.replace('/?v=' + Date.now()), 1000);
    });
  </script>
</body>
</html>
