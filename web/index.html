<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="A new Flutter project.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Learnova">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Learnova</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Unregister all service workers — no caching needed (pwa-strategy=none)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(reg) { reg.unregister(); });
      });
    }
  </script>

  <script>
    // ── Speech Recognition ─────────────────────────────────────────────────
    window.startSpeechRecognition = function(lang, onResult, onError) {
      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { onError('not-supported'); return; }

      var rec = new SpeechRecognition();
      rec.lang = lang || 'en-US';
      rec.continuous = false;
      rec.interimResults = false;
      rec.maxAlternatives = 1;

      var done = false;
      function finish(fn) { if (!done) { done = true; fn(); } }

      var safety = setTimeout(function() { finish(function() { onError('timeout'); }); }, 10000);

      rec.onresult = function(e) {
        clearTimeout(safety);
        var t = '';
        for (var i = 0; i < e.results.length; i++) {
          if (e.results[i].isFinal) t += e.results[i][0].transcript;
        }
        finish(function() { onResult(t.trim()); });
      };

      rec.onerror = function(e) {
        clearTimeout(safety);
        finish(function() { onError(e.error || 'error'); });
      };

      rec.onend = function() {
        clearTimeout(safety);
        finish(function() { onError('no-speech'); });
      };

      try { rec.start(); }
      catch(e) { clearTimeout(safety); finish(function() { onError('start-failed'); }); }
    };

    window.stopSpeechRecognition = function() {
      try {
        if (window._activeRec) { window._activeRec.stop(); window._activeRec = null; }
      } catch(e) {}
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
