<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Learnova">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Learnova</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.startSpeechRecognition = function(lang, onResult, onError) {
      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { onError('not-supported'); return; }

      var attempts = 0;
      var maxAttempts = 2;
      var gotResult = false;

      function start() {
        var rec = new SpeechRecognition();
        rec.lang = lang || 'en-US';
        rec.continuous = false;
        rec.interimResults = false;
        rec.maxAlternatives = 1;

        rec.onresult = function(e) {
          gotResult = true;
          var transcript = e.results[0][0].transcript;
          onResult(transcript.toLowerCase().trim());
        };

        rec.onerror = function(e) {
          if (e.error === 'no-speech' && attempts < maxAttempts && !gotResult) {
            attempts++;
            setTimeout(start, 300);
          } else {
            onError(e.error || 'error');
          }
        };

        rec.onend = function() {
          if (!gotResult && attempts < maxAttempts) {
            attempts++;
            setTimeout(start, 300);
          } else if (!gotResult) {
            onError('end');
          }
        };

        try { rec.start(); } catch(e) { onError('error'); }
      }

      start();
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
